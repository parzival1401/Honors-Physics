notes: "Jun 4 donut deflection sweep, ±10 V command in 200 steps (+10 V first), 0.2 s settle. X sweep drives HVA1 = EOD34, Y sweep drives HVA2 = EOD35 (sweep_channel attribute; serial pairing user-confirmed 2026-10-26). Bench (user's third redrawing, 2026-10-30): 642 nm source; EOD34 (x, HVA1); L1-L2 relay; HWP; EOD35 (y, HVA2); L3-L4 relay; L5-L6 relay (L5 = 13.5 mm, 7.4x expander; other lenses 100 mm); vortex plate (Vortex Photonics V-633-10-1, l = 1) one focal length beyond L6, in the plane conjugate to both deflectors; fold mirror M3; QWP just ahead of L7; camera (Thorlabs DCx, MONO8 8-bit, 5.2 µm pixels, 10 ms exposure) drawn at the L7 focus. That geometry predicts ~0.8 µm/V and a ring of a few µm, against the measured ~4.8 µm/V and ~86 µm, so displacements are kept in µm at the camera and not converted to angle. 'Polarizer' runs have a polarizer ahead of the QWP. Camera x/y are the first/second index of the stored frame (x = 1280-px side). X-sweep step 1 (+10 V, its first frame) is excluded: it is the first-point transient also seen in the polarization sweeps -- zero displacement and NCC back at the control value, although the HVA1 monitor already reads the full drive, so the frame predates the move. The Y sweep's step 1 agrees with its steps 2-3 and is kept. The HVA monitors read with the opposite sign to the command. Resolved nulls: EOD34 141/199, EOD35 187/200. Control: ER 0.0345 ± 0.0163, ring peak 25.560 ADU. Per-step values: Y:\\Projects\\NSF-MINFLUX\\projects\\Data\\Evaluation Experiments\\EOD Driver test\\beam characterizatiom\\donut\\jun4\\deflec_donut\\donut_sweep_steps.csv"
