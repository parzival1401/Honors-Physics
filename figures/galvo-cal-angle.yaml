figure_id: "galvo_cal_angle"
former_title: "Galvo Angle Calibration (pixel size = 5.2 µm, lens f = 100.0 mm)"   # title removed from the image; the caption replaces it
what_it_shows: "Optical angle against command for the X galvo (G1) and Y galvo (G2), with straight-line fits: X 2.0287 ± 0.0005 deg/V (R² 0.999989), Y 1.4446 ± 0.0000 deg/V (R² 1.000000). Grey band = spot off the sensor, excluded."
axes:
  x: "command voltage on the swept axis (V)"
  y: "optical deflection angle along the scan direction (deg), every 4th frame drawn"
data:
  source: "Galvo/9-16-2026/1v-1v sweep/sweep_x_2026-09-16_160810 and sweep_y_2026-09-16_161555 (201 frames each, -1..+1 V in 10 mV steps, 0.1 s settle, 10 ms exposure)"
  script: "MicroscopeMinFlux.jl/dev/analysis/galvo_thesis.jl"
  commit: "a4acb2e on worktree-galvo-delay-analysis"
created: "2026-11-02 17:13:28"
notes: "Bench: 642 nm laser -> M1 -> M2 -> G1 (X galvo) -> L1 -> L2 -> G2 (Y galvo) -> L3 -> camera. L1-L2 is a 1:1 4f relay of two 100 mm lenses imaging G1 onto G2; the camera (ThorCam DCx, 5.2 µm pixels) sits in the focal plane of L3 (f = 100 mm), so position = f tan(optical angle). For the QPD runs a Thorlabs PDQ80A sits bare 200 mm from the galvo, no lens (optics_svg/EOD/galvo_setup.png). Galvos: Cambridge Technology 6230K, Model 671 servo drivers, 12 mm silicon mirrors, configured for 40 deg optical over ±10 V (quote QU200428gt), i.e. 2.0 optical deg/V as ordered, not the generic 671 figure of 4.0 deg/V (0.5 V per mechanical degree). 'Off' in the on/off runs means the servo driver is powered off. G2 tips the beam out of its fold plane (user-confirmed), so the Y deflection is the X-type deflection times cos45°. The 200 mm galvo-to-QPD standoff was measured. Spot centroid: background = median frame level, pixels above 20 % of the peak within ±40 px of the brightest pixel. Excluded: frames whose spot peak is < 10 ADU above background (spot off the sensor; only hot pixels remain) or whose centroid is within 10 px (4 spot sigmas) of an edge, and frames whose peak is below 75 % of the median of their ±5 neighbours (3 consecutive X frames, at -0.06, -0.05, -0.04 V: about 30 % dimmer and smeared, centroids displaced by up to 12 µm; none on Y). Scan direction from a 2-D fit, angle = atan(displacement along the scan / 100 mm). Fit over the 183 (X) and 187 (Y) on-sensor frames; standard errors are the formal least-squares ones. Nominal 2.0 deg/V; Y/X = 0.7121 against 2cos45°/2 = 0.7071 for a fold mirror rotated about an axis in its plane of incidence."
