figure_id: "galvo_delay_frequency"
former_title: "delay vs frequency"   # title removed from the image; the caption replaces it
what_it_shows: "Galvo delay against drive frequency at 0.52 Vpp, rising (filled) and falling (hollow) drive edges: flat with frequency; X rises cross later than X falls."
