  commit: "a4acb2e on worktree-galvo-delay-analysis"
created: "2026-11-02 17:13:52"
notes: "Bench: 642 nm laser -> M1 -> M2 -> G1 (X galvo) -> L1 -> L2 -> G2 (Y galvo) -> L3 -> camera. L1-L2 is a 1:1 4f relay of two 100 mm lenses imaging G1 onto G2; the camera (ThorCam DCx, 5.2 µm pixels) sits in the focal plane of L3 (f = 100 mm), so position = f tan(optical angle). For the QPD runs a Thorlabs PDQ80A sits bare 200 mm from the galvo, no lens (optics_svg/EOD/galvo_setup.png). Galvos: Cambridge Technology 6230K, Model 671 servo drivers, 12 mm silicon mirrors, configured for 40 deg optical over ±10 V (quote QU200428gt), i.e. 2.0 optical deg/V as ordered, not the generic 671 figure of 4.0 deg/V (0.5 V per mechanical degree). 'Off' in the on/off runs means the servo driver is powered off. G2 tips the beam out of its fold plane (user-confirmed), so the Y deflection is the X-type deflection times cos45°. The 200 mm galvo-to-QPD standoff was measured. 10-7-2026: square from the function generator (CH1, 0.52 Vpp) driving the galvo; CH2 = photodiode (RESULTS.md), 5 V/div, an 8.4 V swing between flat rails: the 0.52 Vpp step moves the spot about 3.7 mm (X) / 2.6 mm (Y) at the detector, far past the quadrant's linear range, so the trace only changes while the spot crosses the gap. Its 50 % point is when the spot crosses the gap, its 10-90 % is the gap-crossing time (not the mirror's rise), and if the swing is not centred on the gap rising and falling edges cross at different fractions of the mirror's travel. 20/40, 10 and 4 µs/sample at 100, 500, 1000 Hz; 1 Hz not used (1 ms/sample). Scope Tektronix TDS1001B (8-bit). Delay = drive 50 % crossing (CH1) to the 10 % or 50 % point of the response (CH2); rise = 10-90 % of the response. All edges of a capture are aligned on their drive crossing and averaged (raw samples, no smoothing), each referenced to the CH2 level just before its drive edge and just before the next one (windows ending 50 µs after the drive edge, before the response moves, and starting 60 µs earlier at 1 kHz or 0.3 half-period at 100-500 Hz), and normalised by the capture's median step; crossings are read off the average, ± = jackknife SE over edges. Rising and falling drive edges are kept apart. x 100 Hz: rise d10 273, d50 312, 10-90 90; fall d10 196, d50 239, 10-90 83 µs; x 500 Hz: rise d10 273, d50 312, 10-90 87; fall d10 198, d50 240, 10-90 80 µs; x 1000 Hz: rise d10 276, d50 313, 10-90 85; fall d10 206, d50 244, 10-90 75 µs; y 100 Hz: rise d10 213, d50 276, 10-90 129; fall d10 203, d50 264, 10-90 127 µs; y 500 Hz: rise d10 231, d50 282, 10-90 109; fall d10 219, d50 269, 10-90 107 µs; y 1000 Hz: rise d10 234, d50 284, 10-90 109; fall d10 214, d50 262, 10-90 105 µs."
