created: "2026-11-02 17:13:38"
notes: "Bench: 642 nm laser -> M1 -> M2 -> G1 (X galvo) -> L1 -> L2 -> G2 (Y galvo) -> L3 -> camera. L1-L2 is a 1:1 4f relay of two 100 mm lenses imaging G1 onto G2; the camera (ThorCam DCx, 5.2 µm pixels) sits in the focal plane of L3 (f = 100 mm), so position = f tan(optical angle). For the QPD runs a Thorlabs PDQ80A sits bare 200 mm from the galvo, no lens (optics_svg/EOD/galvo_setup.png). Galvos: Cambridge Technology 6230K, Model 671 servo drivers, 12 mm silicon mirrors, configured for 40 deg optical over ±10 V (quote QU200428gt), i.e. 2.0 optical deg/V as ordered, not the generic 671 figure of 4.0 deg/V (0.5 V per mechanical degree). 'Off' in the on/off runs means the servo driver is powered off. G2 tips the beam out of its fold plane (user-confirmed), so the Y deflection is the X-type deflection times cos45°. The 200 mm galvo-to-QPD standoff was measured. Each reading averages 400 samples on the NI USB-6001 after a 0.05 s settle; 15 readings per dwell. µm scale: the run's own two levels, 0 V and 0.05 V, are a known displacement at the QPD, 200 mm × tan(0.05 V × the calibrated slope) = 0.354 mm (X) and 0.252 mm (Y). The quadrant ratio is not linear over that move (the return point sits at ratio 0.52 (X), -0.05 (Y)), so the scale is the local slope at the return level of a Gaussian-spot model, ratio = erf(sqrt2 (p - p0)/w), fitted through the two levels: X 0.668 mm/unit (secant through the two levels 0.558), Y 0.533 mm/unit (secant 0.575). Single-reading noise (sd within a dwell): X 0.46 µm, Y 0.54 µm."
