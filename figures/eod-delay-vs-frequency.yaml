notes: "Bench: HVA200 driving the EOD with a square wave of about 4.4 Vpp command, about 88 Vpp at the HVA200 output. Scope Tektronix TDS1001B (8-bit). CH1 = HVA200 MONITOR output (not the generator), so the delay runs from the amplifier output to beam motion and excludes the HVA200 itself. CH2 = Thorlabs PDQ80A quadrant detector (150 kHz bandwidth, 10 kV/A); CH2 swings symmetrically through 0 V and reverses with the drive, so it is a difference (position) output, not SUM -- whether X or Y is not recorded in the files. Folder dated 10-16-26; scope stamps read 10/16/2026 for EDO35 and 10/19/2026 for EOD34 (EOD34 recaptured). EDO35 is EOD35 (folder name transposed). EOD35 reads inverted on CH2 and is sign-flipped here. A 150 kHz single pole alone has tau = 1.06 µs: it delays a step's 10 % point by 0.11 µs and its 50 % point by 0.74 µs, with a 10-90 % time of 2.33 µs. Method: every drive edge of a capture is aligned on the drive's own 50 % crossing (t = 0) and the raw CH2 samples are averaged over all edges -- no smoothing. (The drive's 10 % level is inside the CH1 quantisation noise -- one 8-bit level is 10 % of the span -- so it cannot anchor an edge; the drive edge itself is far shorter than a microsecond.) CH2 is expressed as a fraction of the unit's full throw (0 = settled start level, 1 = settled end level, from the captures with half period >= 40 µs; same scope gain in every file). Delay = drive 50 % to the response reaching 10 % of the full throw above its pre-edge level; it is UNRESOLVED below 1.0 sample intervals. Fit: delay t0 then two exponentials (fast share a, tau_f; slow share 1 - a, tau_s) in the periodic steady state of the square drive, fitted jointly to all captures with sub-µs sampling, so a half period that ends before the tail does is modelled rather than read as a faster step. Falling edges are mirrored and analysed the same way. Per-capture fits are in the CSV only, as a check. EOD34 (folder EOD34): full throw 184.0 mV on CH2, CH2 normal; dropped files: 5 kHz = copy of 2 kHz; 8 kHz = copy of 2 kHz. Joint step fit over 10, 15, 20, 30, 50 kHz -- rising: t0 0.46 µs, fast share 0.408, tau_f 0.32 µs, tau_s 3.69 µs (rms 0.019); falling: t0 0.52 µs, fast share 0.426, tau_f 0.27 µs, tau_s 3.73 µs (rms 0.019). Drive (HVA monitor) 10-90 % edge, edge-averaged: 10 kHz 0.67 µs, 15 kHz 0.43 µs, 20 kHz 0.45 µs, 30 kHz 0.43 µs, 50 kHz 0.37 µs. 1 kHz (dt 2.00 µs, 5+4 edges, scope 'TDS 1001B - 11:20:13 AM   10/19/2026'): delay rise 0.47 ± 0.03 µs UNRESOLVED, fall 0.52 µs; fraction at 1/5/10/25 µs rise 0.190/0.778/0.941/0.998, fall 0.204/0.792/0.976/1.041. 2 kHz (dt 2.00 µs, 10+9 edges, scope 'TDS 1001B - 11:21:19 AM   10/19/2026'): delay rise 0.48 ± 0.03 µs UNRESOLVED, fall 0.46 µs; fraction at 1/5/10/25 µs rise 0.193/0.776/0.950/0.998, fall 0.221/0.801/0.975/1.016. 10 kHz (dt 0.40 µs, 9+9 edges, scope 'TDS 1001B - 11:23:10 AM   10/19/2026'): delay rise 0.47 ± 0.01 µs, fall 0.43 µs; fraction at 1/5/10/25 µs rise 0.386/0.813/0.967/1.010, fall 0.418/0.827/0.981/1.022. 15 kHz (dt 0.20 µs, 7+7 edges, scope 'TDS 1001B - 11:23:50 AM   10/19/2026'): delay rise 0.44 ± 0.02 µs, fall 0.48 µs; fraction at 1/5/10/25 µs rise 0.421/0.815/0.967/1.010, fall 0.446/0.826/0.999/1.019. 20 kHz (dt 0.20 µs, 10+9 edges, scope 'TDS 1001B - 11:24:28 AM   10/19/2026'): delay rise 0.44 ± 0.01 µs, fall 0.50 µs; fraction at 1/5/10/25 µs rise 0.406/0.811/0.967/—, fall 0.428/0.840/0.988/—. 30 kHz (dt 0.20 µs, 14+15 edges, scope 'TDS 1001B - 11:25:03 AM   10/19/2026'): delay rise 0.50 ± 0.01 µs, fall 0.50 µs; fraction at 1/5/10/25 µs rise 0.411/0.804/0.957/—, fall 0.430/0.837/0.990/—. 50 kHz (dt 0.10 µs, 12+12 edges, scope 'TDS 1001B - 11:25:41 AM   10/19/2026'): delay rise 0.53 ± 0.02 µs, fall 0.54 µs; fraction at 1/5/10/25 µs rise 0.444/0.813/—/—, fall 0.486/0.836/—/— | EOD35 (folder EDO35): full throw 328.0 mV on CH2, CH2 inverted; dropped files: 8 kHz = copy of 5 kHz. Joint step fit over 10, 15, 20, 30, 50 kHz -- rising: t0 0.36 µs, fast share 0.586, 