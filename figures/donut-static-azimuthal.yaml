notes: "Jun 4 donut, run 'Optimized' (optimazed_donut_pol). Bench (user's redrawing, 2026-10-30): 642 nm source; EOD34 (x, HVA1); L1-L2 relay; HWP; EOD35 (y, HVA2); L3-L4 relay; L5-L6 relay; QWP one focal length beyond L6 (the plane conjugate to both deflectors); fold mirror M3; vortex plate (Vortex Photonics V-633-10-1, l = 1) just ahead of L7; camera (Thorlabs DCx, MONO8 8-bit, 5.2 µm pixels, 10 ms exposure) in the focal plane of L7, so a displacement there is f7 × the beam tilt at L7. 'Polarizer' runs have a polarizer ahead of the QWP. 90 samples, bilinear interpolation. R² on the 81×81-px square around the centre: l=1 0.8904, l=2 0.8971, Gaussian 0.6145. l=1 fit: w = 121.686 µm, r_peak = w/√2 = 86.045 µm, centre (594.535, 349.682) px. Profile: r_peak 91.141 µm, 1/e² inner 19.557 µm, outer 190.469 µm. Counts in ADU (MONO8, exposure 9.991 ms): ring peak (azimuthal mean, bg removed) 25.581, brightest pixel 39, background 0.667 ± 0.475 (5-8 r_peak annulus), null mean 1.889 ± 0.458 over 9 px (max 2), at the darkest 3×3 spot within 0.5 r_peak, 8.733 µm from the ring centre. ER = 0.0478 ± 0.0179; 1-ADU floor 0.0391; a perfect l=1 ring in the same window gives 0.0132. Ring symmetry at r_peak: CV 0.153, m1 0.165, m2 0.040, m4 0.079 (m_k = 2|F_k|/|F_0|)."
