# The same fields are embedded in the PNG (read_figure_info). One figure = one file.
figure_id: "galvo_rise_amplitude"
former_title: "Rise time (CH2 10% → 90%)"   # title removed from the image; the caption replaces it
what_it_shows: "10-90 % rise time of the X and Y galvo at 5-100 mVpp, 1 kHz."
axes:
  x: "square-wave amplitude at 1 kHz (mVpp, log scale); X and Y offset ±3 %"
  y: "10-90 % rise of the edge-averaged response (µs), rising and falling edges together, ± jackknife SE"
data:
  source: "Galvo/10-16-2026 small amp delay/{x,y}/1khz-{5,10,50,100}mVpp.csv"
  script: "MicroscopeMinFlux.jl/dev/analysis/galvo_thesis.jl"
  commit: "a4acb2e on worktree-galvo-delay-analysis"
created: "2026-11-02 17:13:53"
notes: "Bench: 642 nm laser -> M1 -> M2 -> G1 (X galvo) -> L1 -> L2 -> G2 (Y galvo) -> L3 -> camera. L1-L2 is a 1:1 4f relay of two 100 mm lenses imaging G1 onto G2; the camera (ThorCam DCx, 5.2 µm pixels) sits in the focal plane of L3 (f = 100 mm), so position = f tan(optical angle). For the QPD runs a Thorlabs PDQ80A sits bare 200 mm from the galvo, no lens (optics_svg/EOD/galvo_setup.png). Galvos: Cambridge Technology 6230K, Model 671 servo drivers, 12 mm silicon mirrors, configured for 40 deg optical over ±10 V (quote QU200428gt), i.e. 2.0 optical deg/V as ordered, not the generic 671 figure of 4.0 deg/V (0.5 V per mechanical degree). 'Off' in the on/off runs means the servo driver is powered off. G2 tips the beam out of its fold plane (user-confirmed), so the Y deflection is the X-type deflection times cos45°. The 200 mm galvo-to-QPD standoff was measured. 10-16-2026: 1 kHz square from the function generator at 5, 10, 50, 100 mVpp. CH1 = the wave-generator output, which also drives the galvo; CH2 = the Thorlabs PDQ80A (both confirmed by the user). CH1 reads 8, 13-14, 52, 104 mVpp. CH2 is bipolar about 0 V, reverses with the drive and scales with amplitude (X about 10 V/V, Y about 6 V/V of command), i.e. the PDQ80A difference output in its linear range. 2 µs/sample, 5 ms record (5 rising + 5 falling edges). Scope Tektronix TDS1001B (8-bit). Delay = drive 50 % crossing (CH1) to the 10 % or 50 % point of the response (CH2); rise = 10-90 % of the response. All edges of a capture are aligned on their drive crossing and averaged (raw samples, no smoothing), each referenced to the CH2 level just before its drive edge and just before the next one (windows ending 50 µs after the drive edge, before the response moves, and starting 60 µs earlier at 1 kHz or 0.3 half-period at 100-500 Hz), and normalised by the capture's median step; crossings are read off the average, ± = jackknife SE over edges. Rising and falling drive edges are kept apart. X at 5 mVpp not resolved (50 % point jackknife SE > 20 µs or no 10-90 % crossing; CH2 step of a few tens of mV on 50 mV/div, so 8-bit quantisation dominates) and left out of the graph. x 5 mVpp: NaN ± NaN µs; x 10 mVpp: 208 ± 5 µs; x 50 mVpp: 213 ± 2 µs; x 100 mVpp: 201 ± 2 µs; y 5 mVpp: 203 ± 4 µs; y 10 mVpp: 202 ± 4 µs; y 50 mVpp: 203 ± 2 µs; y 100 mVpp: 204 ± 2 µs."
