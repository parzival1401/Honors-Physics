figure_id: "galvo_step_overshoot"
former_title: "overshoot vs frequency"   # title removed from the image; the caption replaces it
what_it_shows: "Overshoot of the X and Y galvo steps against drive frequency, rising (filled) and falling (hollow) edges; error bars are the local cycle-to-cycle noise floor, not the uncertainty of the mean."
axes:
  x: "square-wave frequency (Hz, log scale); rising and falling points offset ±3 % for legibility"
  y: "peak excursion past the final level, % of the step; bars = local noise floor (cycle-to-cycle sd of one sample)"
data:
  source: "Galvo/10-2-2026_xy_high_speed/sq_<axis>_<f>Hz_0.05V_*.h5 (0.05 V square, 10/50/100/200/300 Hz; 10 s at 10 Hz, 3 s at 50 Hz, 1.5 s above; PDQ80A pos/SUM at 9988 S/s)"
  script: "MicroscopeMinFlux.jl/dev/analysis/galvo_thesis.jl"
  commit: "a4acb2e on worktree-galvo-delay-analysis"
created: "2026-11-02 17:13:47"
notes: "Bench: 642 nm laser -> M1 -> M2 -> G1 (X galvo) -> L1 -> L2 -> G2 (Y galvo) -> L3 -> camera. L1-L2 is a 1:1 4f relay of two 100 mm lenses imaging G1 onto G2; the camera (ThorCam DCx, 5.2 µm pixels) sits in the focal plane of L3 (f = 100 mm), so position = f tan(optical angle). For the QPD runs a Thorlabs PDQ80A sits bare 200 mm from the galvo, no lens (optics_svg/EOD/galvo_setup.png). Galvos: Cambridge Technology 6230K, Model 671 servo drivers, 12 mm silicon mirrors, configured for 40 deg optical over ±10 V (quote QU200428gt), i.e. 2.0 optical deg/V as ordered, not the generic 671 figure of 4.0 deg/V (0.5 V per mechanical degree). 'Off' in the on/off runs means the servo driver is powered off. G2 tips the beam out of its fold plane (user-confirmed), so the Y deflection is the X-type deflection times cos45°. The 200 mm galvo-to-QPD standoff was measured. Position = PDQ80A difference / SUM for the driven axis, linearised as erfinv(ratio): the step spans ratios -0.07..0.56 (X) and -0.39..0.07 (Y), where the quadrant response is not linear, and erfinv makes it linear in position for a Gaussian spot (ratio = erf(sqrt2 x / w); w drops out on normalising). Without it the X overshoot reads 1.33 % rising and 1.78 % falling (one end of the step compressed, the other stretched); both columns are in galvo_step_summary.csv. Every edge is normalised to its own levels (start = 12-45 % before it on the previous plateau, end = 50-85 % of its own half period), folded on its own 50 % crossing (the drive is host-paced over USB, so a fixed-period fold would smear) and re-aligned twice on the folded template. t = 0 is the 10 % point of the folded step. Settling = last exit from a ±2 % band about the final level, timed from the 10 % point. Noise floor = median cycle-to-cycle sd of single samples over the settled window, as % of the step. x rise 100 Hz: 1.64 ± 0.21 %; x fall 100 Hz: 1.64 ± 0.19 %; x rise 10 Hz: 1.63 ± 0.21 %; x fall 10 Hz: 1.72 ± 0.19 %; x rise 200 Hz: 1.77 ± 0.21 %; x fall 200 Hz: 1.85 ± 0.20 %; x rise 300 Hz: 1.54 ± 0.21 %; x fall 300 Hz: 1.59 ± 0.19 %; x rise 50 Hz: 1.59 ± 0.21 %; x fall 50 Hz: 1.60 ± 0.19 %; y rise 100 Hz: 0.43 ± 0.19 %; y fall 100 Hz: 0.43 ± 0.20 %; y rise 10 Hz: 0.48 ± 0.19 %; y fall 10 Hz: 0.48 ± 0.20 %; y rise 200 Hz: 0.36 ± 0.20 %; y fall 200 Hz: 0.33 ± 0.21 %; y rise 300 Hz: 0.36 ± 0.20 %; y fall 300 Hz: 0.35 ± 0.21 %; y rise 50 Hz: 0.48 ± 0.19 %; y fall 50 Hz: 0.49 ± 0.21 %."
