what_it_shows: "Spot motion perpendicular to the scan. Y (G2) bows quadratically, 28.81 ± 0.10 µm/V²; dashed = the bow of a 45° fold mirror rotated about an axis in its plane of incidence, f·φ²/2 = 31.79 µm/V² with no free parameter. X (G1): 2.39 ± 0.10 µm/V²."
