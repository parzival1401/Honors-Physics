created: "2026-11-02 17:13:30"
notes: "Bench: 642 nm laser -> M1 -> M2 -> G1 (X galvo) -> L1 -> L2 -> G2 (Y galvo) -> L3 -> camera. L1-L2 is a 1:1 4f relay of two 100 mm lenses imaging G1 onto G2; the camera (ThorCam DCx, 5.2 µm pixels) sits in the focal plane of L3 (f = 100 mm), so position = f tan(optical angle). For the QPD runs a Thorlabs PDQ80A sits bare 200 mm from the galvo, no lens (optics_svg/EOD/galvo_setup.png). Galvos: Cambridge Technology 6230K, Model 671 servo drivers, 12 mm silicon mirrors, configured for 40 deg optical over ±10 V (quote QU200428gt), i.e. 2.0 optical deg/V as ordered, not the generic 671 figure of 4.0 deg/V (0.5 V per mechanical degree). 'Off' in the on/off runs means the servo driver is powered off. G2 tips the beam out of its fold plane (user-confirmed), so the Y deflection is the X-type deflection times cos45°. The 200 mm galvo-to-QPD standoff was measured. Spot centroid: background = median frame level, pixels above 20 % of the peak within ±40 px of the brightest pixel. Excluded: frames whose spot peak is < 10 ADU above background (spot off the sensor; only hot pixels remain) or whose centroid is within 10 px (4 spot sigmas) of an edge, and frames whose peak is below 75 % of the median of their ±5 neighbours (3 consecutive X frames, at -0.06, -0.05, -0.04 V: about 30 % dimmer and smeared, centroids displaced by up to 12 µm; none on Y). Scan direction from a 2-D fit, angle = atan(displacement along the scan / 100 mm). X curves: its local slope runs from 2.055 deg/V at -0.85 V to 2.003 deg/V at +1 V. Y, whose deflection does not pass through the L1-L2 relay, is straight to its noise. That points to the relay (beam up to ±3.5 mm off axis at L1/L2) rather than the scanner, but a galvo nonlinearity is not excluded by these data."
